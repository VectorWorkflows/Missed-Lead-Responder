# docker-compose.yml
#
# ATLAS-ONLY. The local mongo service is gone on purpose.
#
# Two things went wrong with it:
#   1. `environment:` set MONGO_URI and silently overrode the value in .env,
#      so the app read an empty local database while manage_clients.py wrote to
#      Atlas. That single line caused every symptom this project ever had.
#   2. It published 27017 on 0.0.0.0 with no password. A bot found it and wiped
#      the databases, leaving a ransom note.
#
# Both problems disappear when there is no local mongo. Your data already lives
# in Atlas, which is authenticated, backed up, and not your responsibility to
# patch. MONGO_URI in .env is now the ONLY place the database is chosen.

name: missed-lead-responder-app

services:
  app:
    build: .
    container_name: lead_responder_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Nothing here may duplicate a key in .env. Anything listed here WINS,
      # silently. That is the trap. Keep this block to values that genuinely
      # belong to the container rather than to your configuration.
      - PORT=8000
      - DATA_DIR=/data
    volumes:
      # Durable outbox queue + client config snapshot. Without this volume a
      # redeploy drops any work that was mid-retry, and the offline fallback
      # loses its last-known-good client list.
      - app_data:/data
    ports:
      # Bound to localhost only: Caddy reverse-proxies to it, so it never needs
      # to be reachable from the internet directly.
      - "127.0.0.1:8005:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

volumes:
  app_data:
    name: lead_responder_app_data
